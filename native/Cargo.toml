[package]
edition = "2024"
name = "streamq-native"
version = "0.0.0"
license-file = "../LICENSE"

[lib]
crate-type = ["cdylib"]

[dependencies]
crossbeam-channel = "0.5.8"
futures = "0.3.28"
napi = { version = "3.11.0", default-features = false, features = ["napi4", "async", "tokio_rt", "serde-json"] }
napi-derive = "3.6.0"
tokio = { version = "1.32.0", features = ["rt", "rt-multi-thread", "macros"] }
debounce = "0.2"
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
futures-util = "0.3.32"
strum = "0.28.0"
strum_macros = "0.28.0"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }

[target.'cfg(target_os = "windows")'.dependencies]
utf16string = "0.2.0"
uuid = { version = "1.0", features = ["v4"] }
winapi = { version = "0.3.9", features = ["winuser", "windef", "processthreadsapi", "errhandlingapi"] }
windows-version = "0.1"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.51.1"
features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem",  "Win32_Storage_Packaging_Appx", "implement"]


[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.52.0"
features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Media_Audio", "Win32_System_Com"]

[target.'cfg(target_os = "linux")'.dependencies]
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
pulsectl-rs = "0.3"
libpulse-binding = "2.28"
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
webkit2gtk = { version = "2.0.1", features = ["v2_22"] }
mpris-server = "0.8"

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = true
